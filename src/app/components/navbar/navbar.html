<header class="site-header">
  <div class="container">
    <nav class="nav-bar" aria-label="Primary Navigation">
      
      <!-- 1. Brand on Left -->
      <a routerLink="/" class="nav-brand" aria-label="EcoBin Home" (click)="closeMenus()">
        <span class="brand-text">EcoBin</span>
      </a>

      <!-- 2. Navlinks in Center -->
      <div class="nav-links-desktop">
        <a
          routerLink="/"
          routerLinkActive="is-active"
          [routerLinkActiveOptions]="{ exact: true }"
          class="nav-link"
          (click)="closeMenus()"
        >
          Home
        </a>

        <a routerLink="/" fragment="about" class="nav-link" (click)="closeMenus()">
          About
        </a>

        <a routerLink="/" fragment="services" class="nav-link" (click)="closeMenus()">
          Service
        </a>

        <a routerLink="/" fragment="cta" class="nav-link" (click)="closeMenus()">
          Contact
        </a>
      </div>

      <!-- 3. Sign In & Get Started Button on Right -->
      <div class="nav-actions">
        <a routerLink="/sign-in" class="nav-portal-link" (click)="closeMenus()">
          Sign In
        </a>

        <a routerLink="/sign-up" class="nav-cta" (click)="closeMenus()">
          Get Started
        </a>

        <button
          type="button"
          class="mobile-toggle"
          aria-label="Toggle Menu"
          [attr.aria-expanded]="mobileMenuOpen()"
          (click)="toggleMobileMenu()"
        >
          <span></span>
          <span></span>
        </button>
      </div>
    </nav>

    @if (mobileMenuOpen()) {
      <div class="mobile-drawer">
        <a routerLink="/" class="mobile-link" (click)="closeMenus()">Home</a>
        <a routerLink="/" fragment="about" class="mobile-link" (click)="closeMenus()">About</a>
        <a routerLink="/" fragment="services" class="mobile-link" (click)="closeMenus()">Service</a>
        <a routerLink="/" fragment="cta" class="mobile-link" (click)="closeMenus()">Contact</a>
        <a routerLink="/sign-in" class="mobile-link" (click)="closeMenus()">Sign In</a>
        <a routerLink="/sign-up" class="nav-cta mobile-cta" (click)="closeMenus()">
          Get Started
        </a>
      </div>
    }
  </div>
</header>
