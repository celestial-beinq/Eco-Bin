<div class="booking-card">
  @if (isSubmitted()) {
    <div class="success-message">
      <div class="success-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
      </div>
      <div>
        <h4>Pickup Request Received!</h4>
        <p>Thank you, {{ fullName() }}. Our Cleanbin local team will confirm your {{ serviceType() }} for {{ serviceDate() }} shortly.</p>
      </div>
    </div>
  } @else {
    <form (ngSubmit)="onSubmit()" class="booking-form" novalidate>
      
      <!-- Field 1: Name -->
      <div class="form-group">
        <label for="fullName" class="form-label">
          Your Name <span class="required">*</span>
        </label>
        <div class="input-wrapper">
          <input 
            type="text" 
            id="fullName" 
            name="fullName"
            [ngModel]="fullName()" 
            (ngModelChange)="fullName.set($event)"
            placeholder="Type Your Name" 
            required>
        </div>
      </div>

      <!-- Field 2: Service Type -->
      <div class="form-group">
        <label for="serviceType" class="form-label">
          Service Type <span class="required">*</span>
        </label>
        <div class="input-wrapper select-wrapper">
          <select 
            id="serviceType" 
            name="serviceType"
            [ngModel]="serviceType()" 
            (ngModelChange)="serviceType.set($event)"
            required>
            <option value="" disabled selected>Select Service Type</option>
            @for (svc of services; track svc) {
              <option [value]="svc">{{ svc }}</option>
            }
          </select>
          <span class="select-arrow">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
          </span>
        </div>
      </div>

      <!-- Field 3: Contact -->
      <div class="form-group">
        <label for="contactInfo" class="form-label">
          Contact <span class="required">*</span>
        </label>
        <div class="input-wrapper">
          <input 
            type="text" 
            id="contactInfo" 
            name="contactInfo"
            [ngModel]="contactInfo()" 
            (ngModelChange)="contactInfo.set($event)"
            placeholder="Phone or Email" 
            required>
        </div>
      </div>

      <!-- Field 4: Service Date -->
      <div class="form-group">
        <label for="serviceDate" class="form-label">
          Service Date <span class="required">*</span>
        </label>
        <div class="input-wrapper">
          <input 
            type="date" 
            id="serviceDate" 
            name="serviceDate"
            [ngModel]="serviceDate()" 
            (ngModelChange)="serviceDate.set($event)"
            placeholder="Select Date" 
            required>
        </div>
      </div>

      <!-- Submit Button -->
      <div class="form-group form-action">
        <button type="submit" class="btn-submit" [disabled]="isSubmitting()">
          @if (isSubmitting()) {
            <span class="spinner"></span>
            <span>Sending...</span>
          } @else {
            <span>Request Pickup</span>
            <svg class="arrow-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="5" y1="12" x2="19" y2="12"></line>
              <polyline points="12 5 19 12 12 19"></polyline>
            </svg>
          }
        </button>
      </div>

    </form>

    @if (errorMessage()) {
      <div class="error-banner">
        <span>{{ errorMessage() }}</span>
      </div>
    }
  }
</div>
